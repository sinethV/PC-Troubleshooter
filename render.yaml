# Render Blueprint for TechFix Pro / PC Troubleshooter.
# Apply via: Render Dashboard -> New -> Blueprint -> select this repo.
#
# The demo runs the "render" Spring profile (in-memory H2, auto-seeded).

services:
  - type: web
    name: pc-troubleshooter-api
    runtime: docker
    rootDir: backend
    plan: free
    region: singapore
    healthCheckPath: /api/v1/system/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      # allowedOriginPatterns supports the wildcard, so the generated
      # frontend subdomain is accepted without hard-coding it.
      - key: TECHFIX_CORS_ALLOWED_ORIGINS
        value: https://*.onrender.com,http://localhost:5173,http://localhost:3000

  - type: web
    name: pc-troubleshooter-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 20
      # Static-site env vars are baked in at build time. If Render assigns a
      # different API subdomain, update this value and redeploy.
      - key: VITE_API_ORIGIN
        value: https://pc-troubleshooter-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
