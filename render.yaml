# Render Blueprint for TechFix Pro / PC Troubleshooter.
# Apply via: Render Dashboard -> New -> Blueprint -> select this repo.
#
# The demo runs the "render" Spring profile (in-memory H2, auto-seeded).
# Swap SPRING_PROFILES_ACTIVE and add a `databases:` block for PostgreSQL.

services:
  - type: web
    name: pc-troubleshooter-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /api/v1/system/health
    autoDeployTrigger: commit
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      # Public URL of this service, reused by the frontend build.
      - key: PUBLIC_URL
        fromService:
          name: pc-troubleshooter-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      # allowedOriginPatterns supports the wildcard, so the generated
      # frontend subdomain is accepted without hard-coding it.
      - key: TECHFIX_CORS_ALLOWED_ORIGINS
        value: https://*.onrender.com,http://localhost:5173,http://localhost:3000

  - type: web
    name: pc-troubleshooter-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_API_ORIGIN
        fromService:
          name: pc-troubleshooter-api
          type: web
          envVarKey: PUBLIC_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
